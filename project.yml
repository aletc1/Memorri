name: Memorri
options:
  bundleIdPrefix: com.aletc1
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Memorri Local"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MemorriCore:
    path: Packages/MemorriCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    # Pinned exactly: ShortcutAdapter depends on 2.4.0 behaviour found in spike R3 (the `default:`
    # parameter, save-then-onChange, function keys accepted). The generated .xcodeproj, and so
    # Package.resolved, is not committed, so this is the only pin.
    exactVersion: 2.4.0
targets:
  Memorri:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MemorriCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Memorri
        CFBundleDisplayName: Memorri
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "AGPL-3.0"
        NSCalendarsFullAccessUsageDescription: "Memorri writes the appointments it finds into the calendar you choose in Settings, and only there. It never changes your other calendars."
        NSRemindersFullAccessUsageDescription: "Memorri writes the tasks and reminders it finds into the Reminders list you choose in Settings, and only there. It never changes your other lists."
        CFBundleURLTypes:
          - CFBundleURLName: com.aletc1.memorri
            CFBundleURLSchemes:
              - memorri
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletc1.memorri
        PRODUCT_NAME: Memorri
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Check signing identity
        script: '"${SRCROOT}/scripts/check-signing-identity.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Memorri:
    build:
      targets:
        Memorri: all
      preActions:
        - name: Check signing identity
          settingsTarget: Memorri
          script: '"${SRCROOT}/scripts/check-signing-identity.sh"'
    run:
      config: Debug
    archive:
      config: Release
