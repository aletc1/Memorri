name: Memorri
options:
  bundleIdPrefix: com.aletc1
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Memorri Local"
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    ENABLE_USER_SCRIPT_SANDBOXING: NO
packages:
  MemorriCore:
    path: Packages/MemorriCore
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    from: 2.0.0
targets:
  Memorri:
    type: application
    platform: macOS
    sources:
      - path: App
    dependencies:
      - package: MemorriCore
      - package: KeyboardShortcuts
    info:
      path: App/Info.plist
      properties:
        CFBundleName: Memorri
        CFBundleDisplayName: Memorri
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSUIElement: true
        LSMinimumSystemVersion: "26.0"
        NSHumanReadableCopyright: "AGPL-3.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.aletc1.memorri
        PRODUCT_NAME: Memorri
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        GENERATE_INFOPLIST_FILE: NO
    preBuildScripts:
      - name: Check signing identity
        script: '"${SRCROOT}/scripts/check-signing-identity.sh"'
        basedOnDependencyAnalysis: false
schemes:
  Memorri:
    build:
      targets:
        Memorri: all
      preActions:
        - name: Check signing identity
          settingsTarget: Memorri
          script: '"${SRCROOT}/scripts/check-signing-identity.sh"'
    run:
      config: Debug
    archive:
      config: Release
